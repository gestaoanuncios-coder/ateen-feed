name: Atualizar feed OpenAI

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia as 6h (horario de Brasilia)
  workflow_dispatch:       # permite rodar manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Converter XML em CSV
        run: |
          mkdir -p docs
          python convert.py
      - name: Publicar CSV
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/ateen-openai.csv
          git diff --cached --quiet || git commit -m "Atualiza feed $(date -u +%F)"
          git push
